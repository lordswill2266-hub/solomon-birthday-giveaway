<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Giveaway Admin</title><style>body{margin:0;background:#080b11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}h1{font-size:30px;margin:0 0 8px}.sub{color:#9aa1ad;margin:0 0 24px}.card{background:#121720;border:1px solid #303746;border-radius:20px;padding:18px;margin-bottom:16px}.login{max-width:440px;margin:60px auto}.field{margin:14px 0}.field label{display:block;color:#aeb4bf;font-size:13px;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;border:1px solid #343b49;background:#0c1118;color:#fff;border-radius:14px;padding:14px;font-size:16px}button{border:0;border-radius:14px;padding:13px 16px;background:#c51c2a;color:#fff;font-weight:800;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{color:#8f97a5;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.value{font-size:17px;margin-top:3px;word-break:break-word}.account{font-size:22px;font-weight:900;color:#f2c45d}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#202735;color:#dce1e8;font-size:12px;font-weight:800;text-transform:uppercase}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.copy{background:#2a3240}.paid{background:#1f7a47}.status{margin:0 0 16px;color:#aeb4bf}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:22px}.logout{background:#242b36}@media(max-width:580px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="login card"><h1>Private Admin</h1><p class="sub">Birthday Giveaway payouts</p><div class="field"><label>Admin password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">Open Dashboard</button><p id="loginStatus" class="status"></p></section><section id="dashboard" class="hidden"><div class="top"><div><h1>Winner Payouts</h1><p class="sub">View payment details and mark transfers paid.</p></div><button id="logout" class="logout">Log out</button></div><p id="status" class="status">Loading…</p><div id="list"></div></section></main><script>const $=id=>document.getElementById(id);let pass='';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(action='list',extra={}){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass,action,...extra})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function render(rows){const list=$('list');list.innerHTML='';if(!rows.length){$('status').textContent='No payout submissions yet.';return}$('status').textContent=`${rows.length} payout submission${rows.length===1?'':'s'}`;for(const p of rows){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="row"><div><div class="label">Claim code</div><div class="value">${esc(p.claimCode)}</div></div><div><div class="label">Status</div><div class="value"><span class="pill">${esc(p.status)}</span></div></div><div><div class="label">Account name</div><div class="value">${esc(p.accountName)}</div></div><div><div class="label">Bank</div><div class="value">${esc(p.bankName)}</div></div><div><div class="label">Account number</div><div class="value account">${esc(p.accountNumber)}</div></div><div><div class="label">Submitted</div><div class="value">${new Date(p.submittedAt).toLocaleString()}</div></div></div><div class="actions"><button class="copy" data-copy="${esc(p.accountNumber)}">Copy account number</button>${p.status!=='paid'?`<button class="paid" data-paid="${esc(p.id)}">Mark paid</button>`:''}</div>`;list.appendChild(el)}document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy account number',1200)});document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=async()=>{if(!confirm('Mark this payout as paid?'))return;b.disabled=true;try{await api('markPaid',{payoutId:b.dataset.paid});await load()}catch(e){alert(e.message);b.disabled=false}})}async function load(){const d=await api();render(d.payouts||[])}$('loginBtn').onclick=async()=>{pass=$('password').value;const s=$('loginStatus');s.textContent='Checking…';try{await load();$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');s.textContent=''}catch(e){s.textContent=e.message}};$('logout').onclick=()=>{pass='';$('password').value='';$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});</script></body></html>
